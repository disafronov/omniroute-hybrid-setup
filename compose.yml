name: omniroute-hybrid

services:
  omniroute:
    image: ghcr.io/diegosouzapw/omniroute:${OMNIROUTE_LOCAL_VERSION:-latest}
    volumes:
      - omniroute_data:/app/data
    env_file:
      - ./omniroute.env
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - OMNIROUTE_ALLOW_PRIVATE_PROVIDER_URLS=true
      - OMNIROUTE_API_KEY=${OMNIROUTE_LOCAL_API_KEY}
      - INITIAL_PASSWORD
    ports:
      - "20128:20128"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      timeout: 10s
      interval: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  omniroute_data:
