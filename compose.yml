name: omniroute-hybrid

services:
  omniroute:
    image: ghcr.io/diegosouzapw/omniroute:${OMNIROUTE_LOCAL_VERSION:-latest}
    configs:
      - source: patch_id
        target: /tmp/patch.sh
    command: ["sh", "-c", "sh /tmp/patch.sh && exec node dev/run-standalone.mjs"]
    volumes:
      - omniroute_data:/app/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - REQUIRE_API_KEY=true
      - OMNIROUTE_ALLOW_PRIVATE_PROVIDER_URLS=true
      - OMNIROUTE_DISABLE_BACKGROUND_SERVICES=true
      - OMNIROUTE_API_KEY=${OMNIROUTE_LOCAL_API_KEY}
    ports:
      - "20128:20128"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      timeout: 10s
      interval: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

configs:
  patch_id:
    content: |
      #!/bin/sh
      set -e
      echo '[PATCH] Fix AI_InvalidResponseDataError — normalizeResponseId for streaming chunks'
      sed -i 's/if (parsedRecord.id !== undefined) sanitized.id = parsedRecord.id;/if (parsedRecord.id !== undefined) sanitized.id = normalizeResponseId(typeof parsedRecord.id === "string" ? parsedRecord.id : String(parsedRecord.id));/' /app/open-sse/handlers/responseSanitizer.ts
      echo '[PATCH] Skipping stream.ts empty-choices — not present in published image'
      echo '[PATCH] Done'

volumes:
  omniroute_data:
